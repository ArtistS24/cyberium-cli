<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 380" width="100%" height="100%">
  <rect width="1050" height="380" rx="12" fill="#040609" />
  <rect x="10" y="10" width="1030" height="360" rx="10" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.35" />

  <g transform="translate(26, 26)">
    <rect x="0" y="0" width="484" height="100" rx="7" fill="#080b11" stroke="#222c3c" stroke-width="1.1" />
    <line x1="0" y1="12" x2="0" y2="88" stroke="#38bdf8" stroke-width="3.5" />
    <text x="18" y="25" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#f4efe6" letter-spacing="0.8">Lightweight Terminal Lab Helper</text>
    <text x="468" y="24" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.5" fill="#38bdf8">python3 · no pip setup</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">Built with built-in Python 3 modules so it runs directly on Linux</text>
    <text x="18" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">lab VMs (Kali, Fedora, Ubuntu) without needing virtual environments</text>
    <text x="18" y="86" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.2" fill="#79c0ff">or extra third-party packages during hands-on lab exercises.</text>
  </g>

  <g transform="translate(540, 26)">
    <rect x="0" y="0" width="484" height="100" rx="7" fill="#080b11" stroke="#222c3c" stroke-width="1.1" />
    <line x1="0" y1="12" x2="0" y2="88" stroke="#10b981" stroke-width="3.5" />
    <text x="18" y="25" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#f4efe6" letter-spacing="0.8">Browser Cookie Session Sync</text>
    <text x="468" y="24" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.5" fill="#10b981">sqlite3 · firefox cookies</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">Reads the active Cyberium session cookie from Firefox-based Linux</text>
    <text x="18" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">browsers (Firefox, LibreWolf, Zen) using sqlite3 so you can launch</text>
    <text x="18" y="86" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.2" fill="#7ee787">the CLI without copying tokens manually from browser DevTools.</text>
  </g>

  <g transform="translate(26, 138)">
    <rect x="0" y="0" width="484" height="100" rx="7" fill="#080b11" stroke="#222c3c" stroke-width="1.1" />
    <line x1="0" y1="12" x2="0" y2="88" stroke="#d4a359" stroke-width="3.5" />
    <text x="18" y="25" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#f4efe6" letter-spacing="0.8">Interactive Dual-Pane Curses TUI</text>
    <text x="468" y="24" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.5" fill="#d4a359">cyberium tui · curses</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">Full-screen terminal menu for browsing enrolled course tracks,</text>
    <text x="18" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">checking question completion status, searching prompts, and moving</text>
    <text x="18" y="86" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.2" fill="#f0c882">between lab modules with simple keyboard shortcuts (j/k, Tab, Enter).</text>
  </g>

  <g transform="translate(540, 138)">
    <rect x="0" y="0" width="484" height="100" rx="7" fill="#080b11" stroke="#222c3c" stroke-width="1.1" />
    <line x1="0" y1="12" x2="0" y2="88" stroke="#a855f7" stroke-width="3.5" />
    <text x="18" y="25" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#f4efe6" letter-spacing="0.8">Course PDF Viewer &amp; Downloader</text>
    <text x="468" y="24" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.5" fill="#a855f7">cyberium book · PDF</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">Fetches official course PDF booklets for the active module so you</text>
    <text x="18" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">can open them in a terminal reader (-o), save a local copy (-d),</text>
    <text x="18" y="86" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.2" fill="#d2a8ff">or copy the document link (-c) while working through a lab.</text>
  </g>

  <g transform="translate(26, 250)">
    <rect x="0" y="0" width="484" height="100" rx="7" fill="#080b11" stroke="#222c3c" stroke-width="1.1" />
    <line x1="0" y1="12" x2="0" y2="88" stroke="#56d364" stroke-width="3.5" />
    <text x="18" y="25" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#f4efe6" letter-spacing="0.8">Direct Terminal Flag Submission</text>
    <text x="468" y="24" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.5" fill="#56d364">cyberium submit</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">Submits lab answers and flags directly from the command line</text>
    <text x="18" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">without switching back to the browser, showing immediate pass/fail</text>
    <text x="18" y="86" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.2" fill="#7ee787">feedback and moving the active pointer to the next question.</text>
  </g>

  <g transform="translate(540, 250)">
    <rect x="0" y="0" width="484" height="100" rx="7" fill="#080b11" stroke="#222c3c" stroke-width="1.1" />
    <line x1="0" y1="12" x2="0" y2="88" stroke="#fbbf24" stroke-width="3.5" />
    <text x="18" y="25" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#f4efe6" letter-spacing="0.8">Per-Question Lab Notes Scratchpad</text>
    <text x="468" y="24" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.5" fill="#fbbf24">cyberium notes · JSON</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">Saves personal lab notes, target IPs, and command snippets for each</text>
    <text x="18" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.8" fill="#9da9bb">question inside ~/.config/cyberium/notes.json so your findings</text>
    <text x="18" y="86" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.2" fill="#f0c882">stay organized across study sessions.</text>
  </g>
</svg>
