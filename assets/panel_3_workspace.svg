<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 330" width="100%" height="100%">
  <rect width="1050" height="330" rx="12" fill="#040609" />
  <rect x="10" y="10" width="1030" height="310" rx="10" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.38" />

  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="488" height="280" rx="7" fill="#080b11" stroke="#222c3c" stroke-width="1.1" />
    <rect x="1" y="1" width="486" height="34" rx="6" fill="#0d1f18" />
    <line x1="0" y1="35" x2="488" y2="35" stroke="#222c3c" stroke-width="1" />
    <line x1="0" y1="8" x2="0" y2="28" stroke="#10b981" stroke-width="3.5" />
    <text x="16" y="23" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="700" fill="#34d399" letter-spacing="1.1">LOCAL CONFIG &amp; CACHE DIRECTORIES</text>
    <text x="472" y="23" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.2" fill="#7d8a9e">[~/.config/cyberium]</text>

    <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.5" fill="#c9d1d9">
      <text x="16" y="58" fill="#f0f6fc" font-weight="700">~/.config/cyberium/ (User Settings &amp; Notes)</text>
      <text x="16" y="78" fill="#6e7681">├──</text> <text x="44" y="78" fill="#34d399" font-weight="700">config.json</text> <text x="148" y="78" fill="#8b949e">Session cookie, active track &amp; theme</text>
      <text x="16" y="98" fill="#6e7681">├──</text> <text x="44" y="98" fill="#fbbf24" font-weight="700">notes.json</text> <text x="148" y="98" fill="#8b949e">Per-question lab notes &amp; memos</text>
      <text x="16" y="118" fill="#6e7681">└──</text> <text x="44" y="118" fill="#82b8f0">session.lock</text> <text x="148" y="118" fill="#8b949e">Local lockfile for config updates</text>
      <text x="16" y="142" fill="#f0f6fc" font-weight="700">~/.cache/cyberium/ (Downloaded Course Files)</text>
      <text x="16" y="162" fill="#6e7681">└──</text> <text x="44" y="162" fill="#a855f7" font-weight="700">books/</text> <text x="148" y="162" fill="#8b949e">Saved course PDFs for offline reading</text>
      <line x1="16" y1="180" x2="472" y2="180" stroke="#1b2330" />
      <text x="16" y="202" fill="#79c0ff" font-weight="700">Local File Permissions</text>
      <text x="16" y="222" fill="#8b949e">• Stores session tokens locally in user home folder</text>
      <text x="16" y="242" fill="#8b949e">• Keeps lab notes separate per track and question</text>
      <text x="16" y="262" fill="#7ee787">• Restricts config directory permissions to current user</text>
    </g>
  </g>

  <g transform="translate(538, 24)">
    <rect x="0" y="0" width="488" height="280" rx="7" fill="#080b11" stroke="#222c3c" stroke-width="1.1" />
    <rect x="1" y="1" width="486" height="34" rx="6" fill="#121824" />
    <line x1="0" y1="35" x2="488" y2="35" stroke="#222c3c" stroke-width="1" />
    <line x1="0" y1="8" x2="0" y2="28" stroke="#38bdf8" stroke-width="3.5" />
    <text x="16" y="23" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="700" fill="#79c0ff" letter-spacing="1.1">REPOSITORY STRUCTURE &amp; MODULES</text>
    <text x="472" y="23" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.2" fill="#79c0ff">[cyberium-cli/]</text>

    <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10.5" fill="#c9d1d9">
      <text x="16" y="58" fill="#f0f6fc" font-weight="700">cyberium/ (CLI &amp; TUI Modules)</text>
      <text x="16" y="78" fill="#6e7681">├──</text> <text x="44" y="78" fill="#34d399" font-weight="700">cli.py</text> <text x="160" y="78" fill="#8b949e">Command-line argument handler</text>
      <text x="16" y="98" fill="#6e7681">├──</text> <text x="44" y="98" fill="#38bdf8" font-weight="700">tui.py</text> <text x="160" y="98" fill="#8b949e">Full-screen curses track &amp; question menu</text>
      <text x="16" y="118" fill="#6e7681">├──</text> <text x="44" y="118" fill="#f59e0b" font-weight="700">api.py</text> <text x="160" y="118" fill="#8b949e">HTTPS client for questions, PDFs &amp; flags</text>
      <text x="16" y="138" fill="#6e7681">├──</text> <text x="44" y="138" fill="#a855f7" font-weight="700">config.py</text> <text x="160" y="138" fill="#8b949e">Browser SQLite cookie reader &amp; notes storage</text>
      <text x="16" y="158" fill="#6e7681">└──</text> <text x="44" y="158" fill="#fb7185" font-weight="700">themes.py</text> <text x="160" y="158" fill="#8b949e">Terminal color palettes</text>
      <line x1="16" y1="180" x2="472" y2="180" stroke="#1b2330" />
      <text x="16" y="202" fill="#34d399" font-weight="700">docs/ &amp; install.sh</text>
      <text x="16" y="222" fill="#82b8f0">• Cyberium_CLI_POC_Denis_Albin.pdf</text> <text x="275" y="222" fill="#8b949e">8-Page Walkthrough PDF</text>
      <text x="16" y="242" fill="#82b8f0">• ./install.sh</text> <text x="275" y="242" fill="#8b949e">Links ~/.local/bin/cyberium</text>
    </g>
  </g>
</svg>
