    <path d="M0 24 L224 24" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="19" fill="#38bdf8" class="mono step-num">01 · FRONTEND</text>
    <circle cx="206" cy="15" r="4.5" fill="#38bdf8" />
    
    <text x="14" y="52" class="mono title">Curses &amp; CLI</text>
    <text x="14" y="74" class="mono sub">• Fullscreen ncurses TUI</text>
    <text x="14" y="94" class="mono sub">• Instant CLI runner</text>
    <text x="14" y="114" class="mono sub">• 16 ANSI color themes</text>

    <rect x="14" y="134" width="196" height="24" rx="4" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-width="0.8" />
    <text x="112" y="150" fill="#38bdf8" class="mono badge" text-anchor="middle">PURE PYTHON STDLIB</text>
  </g>

  <path d="M250 108 L272 108" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3" />
  <polygon points="276,108 268,103 268,113" fill="#38bdf8" />

  <g transform="translate(282, 22)">
    <rect width="224" height="172" rx="7" fill="#0d1420" stroke="#1e293b" stroke-width="1.2" />
    <rect width="224" height="30" rx="7" fill="#0f172a" />
    <path d="M0 24 L224 24" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="19" fill="#10b981" class="mono step-num">02 · AUTH &amp; SYNC</text>
    <circle cx="206" cy="15" r="4.5" fill="#10b981" />

