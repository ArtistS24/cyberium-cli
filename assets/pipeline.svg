<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 216" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
      .title { fill: #f8fafc; font-weight: 700; font-size: 13.5px; }
      .sub { fill: #94a3b8; font-size: 11.0px; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; }
      .step-num { font-size: 11.5px; font-weight: 800; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect x="2" y="2" width="1046" height="212" rx="10" fill="#040609" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.2" />

  <g transform="translate(18, 22)">
    <rect width="224" height="172" rx="7" fill="#0d1420" stroke="#1e293b" stroke-width="1.2" />
