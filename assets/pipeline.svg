    <rect x="14" y="134" width="194" height="24" rx="4" fill="#701a75" fill-opacity="0.2" stroke="#c026d3" stroke-width="0.8" />
    <text x="111" y="150" fill="#e879f9" class="mono badge" text-anchor="middle">EDGE DELIVERY</text>
